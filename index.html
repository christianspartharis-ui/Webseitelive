<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYBZON – Vorregistrierung</title>
  <style>
    :root {
      --bg: #07080d;
      --card: #121521;
      --acc: #b8ff01;
      --hot: #ff0055;
      --text: #ffffff;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at top left, rgba(184,255,1,0.18), transparent 45%),
                  radial-gradient(circle at bottom right, rgba(255,0,85,0.18), transparent 45%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      background: var(--card);
      max-width: 440px;
      width: 100%;
      padding: 26px 20px;
      border-radius: 24px;
      border: 1.5px solid rgba(184, 255, 1, 0.35);
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 25px rgba(184,255,1,0.15);
      text-align: center;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 0, 85, 0.18); border: 1px solid var(--hot);
      color: #ff4d88; padding: 5px 12px; border-radius: 99px; font-size: 11px; font-weight: 800;
    }
    .live-dot { width: 8px; height: 8px; background: var(--hot); border-radius: 50%; box-shadow: 0 0 8px var(--hot); }
    .moods { display: flex; gap: 6px; }
    .mood-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.4); }
    .logo-box {
      width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 20px;
      background: #0b0d14; border: 2px solid var(--acc);
      box-shadow: 0 0 20px rgba(184,255,1,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 900; color: var(--acc);
    }
    h1 { font-size: 30px; font-weight: 900; letter-spacing: 1px; color: #ffffff; margin-bottom: 4px; }
    .subtitle { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--acc); margin-bottom: 10px; }
    .desc { color: var(--muted); font-size: 14px; line-height: 1.4; margin-bottom: 16px; }
    .features { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .feat { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    label.lbl { font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: -6px; display: block; }
    input[type="text"], input[type="email"], select {
      width: 100%; padding: 13px 14px; border-radius: 12px;
      border: 1px solid #2d3548; background: #07080d; color: #fff; font-size: 15px; outline: none;
    }
    input:focus, select:focus { border-color: var(--acc); }
    .vip-box { background: rgba(184, 255, 1, 0.08); border: 1px solid rgba(184, 255, 1, 0.35); border-radius: 12px; padding: 10px 12px; }
    .chk { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #cbd5e1; cursor: pointer; }
    .chk input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--acc); }
    button {
      background: var(--acc); color: #05060a; border: none; padding: 15px;
      border-radius: 12px; font-size: 16px; font-weight: 900; text-transform: uppercase;
      cursor: pointer; box-shadow: 0 0 20px rgba(184,255,1,0.35); margin-top: 4px;
    }
    #status { margin-top: 14px; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 700; display: none; text-align: center; }
    .success { background: rgba(184,255,1,0.15); border: 1px solid var(--acc); color: var(--acc); }
    .error { background: rgba(255,0,85,0.15); border: 1px solid var(--hot); color: #ff4d88; }
    .footer { margin-top: 16px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>

  <div class="card">
    <div class="top-bar">
      <div class="live-pill"><span class="live-dot"></span> BALD IM PLAY STORE</div>
      <div class="moods">
        <div class="mood-dot" style="background:#b8ff01" onclick="setMood('#b8ff01')"></div>
        <div class="mood-dot" style="background:#00f0ff" onclick="setMood('#00f0ff')"></div>
        <div class="mood-dot" style="background:#ff0055" onclick="setMood('#ff0055')"></div>
      </div>
    </div>

    <div class="logo-box">VZ</div>
    <h1>VYBZON</h1>
    <div class="subtitle">Short, Video & Live Club</div>
    <p class="desc">Sichere dir jetzt deinen Platz auf der offiziellen Warteliste und starte als Erster in den Club!</p>

    <div class="features">
      <div class="feat">🎬 Short Video Feed</div>
      <div class="feat">🎙️ 8er Multi-Live</div>
      <div class="feat">💎 Coins & Diamonds</div>
      <div class="feat">👑 Exklusiver VIP Club</div>
    </div>

    <form id="waitlist-form">
      <label class="lbl" for="vorname">Dein Vorname / Creator-Name</label>
      <input type="text" id="vorname" name="vorname" placeholder="z. B. Max" required>

      <label class="lbl" for="email">Deine Google-Play E-Mail</label>
      <input type="email" id="email" name="email" placeholder="deine.mail@gmail.com" required>

      <label class="lbl" for="land">Dein Land</label>
      <select id="land" name="land" required>
        <option value="" disabled selected>Bitte Land auswählen...</option>
        <option value="Deutschland">🇩🇪 Deutschland</option>
        <option value="Österreich">🇦🇹 Österreich</option>
        <option value="Schweiz">🇨🇭 Schweiz</option>
        <option value="Luxemburg">🇱🇺 Luxemburg</option>
        <option value="Niederlande">🇳🇱 Niederlande</option>
        <option value="Frankreich">🇫🇷 Frankreich</option>
        <option value="Spanien">🇪🇸 Spanien</option>
        <option value="Italien">🇮🇹 Italien</option>
        <option value="Griechenland">🇬🇷 Griechenland</option>
        <option value="Türkei">🇹🇷 Türkei</option>
        <option value="UK">🇬🇧 Großbritannien (UK)</option>
        <option value="USA">🇺🇸 USA</option>
        <option value="Anderes Land">🌍 Anderes Land</option>
      </select>

      <div class="vip-box">
        <label class="chk">
          <input type="checkbox" name="beta_tester" value="Ja" checked>
          <span>🔥 <strong>VIP Beta-Zugang:</strong> Ich möchte die App schon vorab testen!</span>
        </label>
      </div>

      <label class="chk">
        <input type="checkbox" required>
        <span>Ich stimme zu, dass mein Name, Land und meine E-Mail für den App-Start gespeichert werden.</span>
      </label>

      <button type="submit" id="submit-btn">⚡ Jetzt VIP-Platz sichern</button>
    </form>

    <div id="status"></div>
    <div class="footer">© 2026 VYBZON • Short, Video & Live Club</div>
  </div>

  <script>
    const SCRIPT_URL = 'DEINE_WEB_APP_URL_HIER_EINFUEGEN';

    function setMood(color) {
      document.documentElement.style.setProperty('--acc', color);
    }

    const form = document.getElementById('waitlist-form');
    const status = document.getElementById('status');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Wird eingetragen...';
      status.style.display = 'none';

      const formData = new FormData(form);
      const vorname = formData.get('vorname');

      try {
        const res = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
        const data = await res.json();
        status.style.display = 'block';
        if (data.result === 'success') {
          status.className = 'success';
          status.textContent = '🎉 Willkommen im Club, ' + vorname + '! Du bist auf der Liste.';
          form.reset();
        } else {
          status.className = 'error';
          status.textContent = 'Fehler beim Speichern.';
        }
      } catch (err) {
        status.style.display = 'block';
        status.className = 'error';
        status.textContent = 'Hinweis: Bitte noch deine Google-Tabellen Script-URL im Code eintragen.';
      }
      btn.disabled = false;
      btn.textContent = '⚡ Jetzt VIP-Platz sichern';
    });
  </script>
</body>
</html>
